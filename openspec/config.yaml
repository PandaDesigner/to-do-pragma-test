schema: spec-driven

context: |
  Proyecto: Todo Notebook; la app, las pruebas y el tema ya existen en develop.
  Fuentes: docs/prueba-tecnica.pdf, docs/PROMPT.md, docs/design.json, docs/design.md y docs/mocks/.
  Stack instalado: Ionic 8, Angular 22 standalone, TypeScript strict, Cordova y Jest; no Capacitor.
  Arquitectura: pages → store → domain ← data; core/di conecta implementaciones; shared solo input/output; SignalStore.
  Persistencia: Ionic Storage, SQLite nativo → IndexedDB → LocalStorage; Firebase Remote Config enable_categories.
  Calidad: SDD y TDD obligatorio RED-GREEN-REFACTOR; ESLint y Prettier; runner Jest aprobado.
  Convención SDD: cuatro artefactos centrales por cambio: proposal.md, design.md, specs/<capacidad>/spec.md y tasks.md.
  sdd-explore y sdd-verify son actividades repetibles; exploration.md y verify-report.md son documentos complementarios actualizables dentro de openspec/changes/<cambio>/, no nuevos artefactos del esquema.
  Guardar exploration.md cuando se explore un cambio nombrado con sdd-explore; openspec-explore no exige ese documento. Registrar en verify-report.md la evidencia de cada verificación y distinguirla de resultados anteriores.
  sdd-apply implementa código y pruebas por partes y actualiza el progreso en tasks.md; no genera apply.md. Si aparecen nuevas dudas, se puede volver a explorar, ajustar los artefactos afectados y continuar antes de verificar de nuevo.
  Gitflow aprobado: main, develop, feature/*, release/*, hotfix/*; Conventional Commits; PR funcional hacia develop.
  Destino público creado: PandaDesigner/to-do-pragma-test; conectar Git local mediante origin HTTPS.
  PR init incluye scaffolding Ionic con CLI, Cordova y preparación de pruebas; no incluye funcionalidades de la app base.
  Las instrucciones vigentes están en AGENTS.md. El avance entre fases es autónomo cuando se cumplen sus reglas y paradas.

rules:
  proposal:
    - Leer docs/PROMPT.md y las fuentes visuales antes de proponer cambios; no inventar requisitos del PDF ausente.
    - Identificar alcance, exclusiones, módulos afectados, cambio OpenSpec, rama de origen y destino del PR.
    - Mantener un cambio OpenSpec por PR de implementación; excepciones y PR de release deben referenciar sus cambios.
    - Empezar por init; separar app base, UI, categorías, patrones, Firebase, rendimiento y builds/documentación según dependencias.
    - No crear ni publicar recursos fuera del repositorio público autorizado; nunca publicar credenciales.
    - Si el cambio toca UI, declararlo en Impact, citar los nodos de Figma y seguir docs/workflow-mcp.md.
    - Indicar o crear la fila Notion del cambio según docs/workflow-mcp.md.
  specs:
    - Escribir requisitos verificables con MUST/SHALL/SHOULD y escenarios Given/When/Then.
    - Asignar identificadores estables para relacionar requisitos, escenarios, tests y descripción del PR.
    - No crear specs vacías; conservar specs activas en changes hasta verificarlas y sincronizarlas mediante archivo.
    - Incluir éxito y errores relevantes; distinguir scaffolding de app base funcional y de entrega firmada.
    - Cada requisito UI cita su nodo y cada escenario UI dice que es conforme a ese nodo de Figma.
  design:
    - Reutilizar las capas y convenciones Ionic de docs/PROMPT.md; generar artefactos mediante CLI.
    - Verificar compatibilidad de versiones antes de instalar; no dar por instaladas las tecnologías requeridas.
    - Resolver explícitamente el runner de pruebas y las decisiones arquitectónicas abiertas antes de implementar.
    - Documentar riesgos y reversión para cambios de persistencia, configuración o dependencias; diagramar flujos complejos.
    - En cambios UI, consultar Figma antes de escribir design.md e incluir Fuente Figma y el mapeo hacia src/theme.
    - Si Figma y docs/design.json discrepan, prevalece Figma y se actualiza design.json en el mismo cambio.
  tasks:
    - Agrupar por fases con numeración jerárquica y tareas pequeñas. Avanzar sin confirmación intermedia salvo una parada de AGENTS.md.
    - Para cada comportamiento escribir primero un test, ejecutarlo y comprobar fallo por el comportamiento ausente (RED).
    - Implementar lo mínimo para pasar (GREEN), refactorizar y repetir pruebas; registrar comandos y resultados reales en verificación.
    - No posponer tests a la fase final; scaffolding generado se valida con pruebas de configuración y arranque, sin alegar TDD retroactivo.
    - Antes del PR ejecutar tests, lint, formato, tipos y build aplicables; registrar bloqueos, sin declarar verificaciones no ejecutadas.
    - Incluir en el PR cambio OpenSpec, requisitos, escenarios, tests, evidencia y sección Reutilización.
    - Cambios UI incluyen capturas de 375x812 en light y dark, enlazadas en verify-report.md.
    - Todo cambio actualiza su fila Notion al iniciar, abrir PR, terminar, bloquearse o crearla si falta.
    - No archivar ni fusionar cambios incompletos; el archivo ocurre después del merge en su PR separado.
