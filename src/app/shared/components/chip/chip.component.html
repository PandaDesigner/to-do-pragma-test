<button
  type="button"
  class="chip"
  [class.selected]="selected()"
  [attr.aria-pressed]="selected()"
  (click)="choose.emit()"
>
  <span class="dot" [attr.data-color]="colorToken()" aria-hidden="true"></span>
  <ng-content select="[appChipIcon]"></ng-content>
  <span>{{ label() }}</span>
</button>
