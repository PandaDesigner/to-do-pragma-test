<ion-item-sliding>
  <ion-item lines="none" class="task-slide" [button]="false">
    <article
      class="task-row"
      [attr.data-kind]="presentation().kind"
      [class.completed]="task().status === 'completed'"
      [class.note]="presentation().kind === 'note'"
    >
      <app-task-item-leading />
      <app-task-item-copy />
      <app-task-item-actions />
    </article>
  </ion-item>
  @if (presentation().showsSwipe()) {
    <ion-item-options side="end">
      <ion-item-option
        color="danger"
        [disabled]="disabled()"
        [attr.aria-label]="'task.delete' | translate: { title: task().title }"
        (click)="emitRemove(task().id)"
      >
        <ion-icon [icon]="icons.trashOutline" aria-hidden="true" />
        {{ 'task.deleteAction' | translate }}
      </ion-item-option>
    </ion-item-options>
  }
</ion-item-sliding>
