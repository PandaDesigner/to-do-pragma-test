<article class="task-row" [class.completed]="task().status === 'completed'">
  <label class="task-check">
    <input
      type="checkbox"
      [checked]="task().status === 'completed'"
      [disabled]="disabled() || !canToggle()"
      [attr.aria-label]="'Completar o reabrir ' + task().title"
      [style.--app-category-tint]="resolvedCategoryColor()"
      (change)="taskToggle.emit(task().id)"
    />
  </label>
  <div class="task-copy">
    <strong class="task-title" [attr.title]="task().title">{{ task().title }}</strong>
    <div class="task-meta">
      <span class="task-due" [attr.title]="task().dueDate">{{ task().dueDate }}</span>
      @if (showCategories() && categoryName()) {
        <span
          class="category-chip"
          [style.--app-category-tint]="resolvedCategoryColor()"
          [attr.title]="categoryName()"
        >
          @if (resolvedCategoryIcon(); as icon) {
            <ion-icon class="category-chip__icon" [icon]="icon" aria-hidden="true"></ion-icon>
          }
          <span class="category-chip__label">{{ categoryName() }}</span>
        </span>
      }
    </div>
  </div>
  <div class="task-actions">
    <button
      type="button"
      [disabled]="disabled()"
      [attr.aria-label]="'Editar ' + task().title"
      (click)="edit.emit(task())"
    >
      <ion-icon [icon]="icons.createOutline" aria-hidden="true" />
    </button>
    @for (event of extraActions(); track event) {
      <button
        type="button"
        [disabled]="disabled()"
        [attr.aria-label]="labels[event] + ': ' + task().title"
        (click)="action.emit({ id: task().id, event })"
      >
        <ion-icon [icon]="actionIcons[event]" aria-hidden="true" />
      </button>
    }
    <button
      type="button"
      class="danger"
      [disabled]="disabled()"
      [attr.aria-label]="'Eliminar ' + task().title"
      (click)="remove.emit(task().id)"
    >
      <ion-icon [icon]="icons.trashOutline" aria-hidden="true" />
    </button>
  </div>
</article>
